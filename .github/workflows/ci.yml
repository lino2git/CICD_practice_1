name: UI Automation & CI

on:
  push:
    branches: [ "main", "feature/**" ] # 👈 允許所有 feature/ 開頭的分支觸發 CI
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: 檢出程式碼
      uses: actions/checkout@v4

    - name: 設定 Python 環境
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 安裝專案套件
      run: |
        python -m pip install --upgrade pip
        pip install pytest-playwright

    - name: 安裝 Playwright 瀏覽器及其依賴
      run: |
        playwright install --with-deps

    - name: 執行 UI 自動化測試
      run: |
          pytest test_ui.py --screenshot=only-on-failure --video=retain-on-failure --output=test-results
          # 即使測試失敗，也要繼續執行後續的上傳步驟
          continue-on-error: true

    - name: 上傳失敗截圖與影片 (Artifacts)
      if: failure() || steps.test.outcome == 'failure'
      uses: actions/upload-artifact@v4
      with:
        name: playwright-failure-artifacts
        path: test-results/